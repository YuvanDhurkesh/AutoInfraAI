packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  # Not needed: protobufjs's postinstall only prints a version-scheme warning,
  # and @google/genai's "prepare" script isn't shipped in the published package.
  "@google/genai": false
  protobufjs: false

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - argon2
  - esbuild
  - msgpackr-extract
  - prisma
  - sharp
