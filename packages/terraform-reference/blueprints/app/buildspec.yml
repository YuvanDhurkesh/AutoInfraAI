version: 0.2

# Generated by AutoInfra. Files AutoInfra adds to the source (scripts,
# Dockerfiles, compose file) are in ./.autoinfra/; the repo itself is untouched.
env:
  variables:
    AUTOINFRA_FE_DIR: {{FE_DIR_YAML}}
    AUTOINFRA_FE_INSTALL: {{FE_INSTALL_YAML}}
    AUTOINFRA_FE_BUILD: {{FE_BUILD_YAML}}
    AUTOINFRA_FE_OUT: {{FE_OUT_YAML}}
    AUTOINFRA_API_VAR: {{API_VAR_YAML}}
    AUTOINFRA_API_SUFFIX: {{API_SUFFIX_YAML}}
    AUTOINFRA_LOCALHOST_ORIGINS: {{LOCALHOST_ORIGINS_YAML}}
    AUTOINFRA_LOCALHOST_SUFFIX: {{LOCALHOST_SUFFIX_YAML}}
    AUTOINFRA_WS_SUFFIX: {{WS_SUFFIX_YAML}}
    AUTOINFRA_PAGES: {{PAGES_YAML}}
    AUTOINFRA_BE_DIR: {{BE_DIR_YAML}}
    AUTOINFRA_BE_PORT: {{BE_PORT_YAML}}
    AUTOINFRA_BE_LOCALHOST_ORIGINS: {{BE_LOCALHOST_ORIGINS_YAML}}
    AUTOINFRA_BE_LANG: {{BE_LANG_YAML}}
    AUTOINFRA_BE_INSTALL: {{BE_INSTALL_YAML}}
    AUTOINFRA_BE_BUILD: {{BE_BUILD_YAML}}
    AUTOINFRA_RUNTIME_NEEDS: {{RUNTIME_NEEDS_YAML}}

phases:
  install:
    runtime-versions:
      nodejs: 22
{{#if PYTHON_LAMBDA}}
      python: 3.12
{{/if}}
  build:
    on-failure: ABORT
    commands:
      - IMAGE_TAG="build-$CODEBUILD_BUILD_NUMBER"
{{#if HAS_FRONTEND}}
      # Public build-time variables, the API address, localhost URLs -> the live URL.
      - bash .autoinfra/prepare-frontend.sh
{{/if}}
{{#if BE_LOCALHOST}}
      # localhost URLs in the backend (CORS allow-lists, redirects) -> the live URL.
      - bash .autoinfra/prepare-backend.sh
{{/if}}
{{#if STATIC_FRONTEND}}
      - bash .autoinfra/build-frontend.sh
{{/if}}
{{#if F2}}
      - aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URL%%/*}"
{{#if SSR_FRONTEND}}
      # Server-rendered frontend: its own image, served by the "web" container.
      - docker build -t "$ECR_REPOSITORY_URL:web-$IMAGE_TAG" -f .autoinfra/Dockerfile.web --build-arg AUTOINFRA_WEB_FRAMEWORK={{WEB_FRAMEWORK}} --build-arg AUTOINFRA_BUILD_ENV="$(cat /tmp/autoinfra-frontend.env)" "$AUTOINFRA_FE_DIR"
      - docker push "$ECR_REPOSITORY_URL:web-$IMAGE_TAG"
{{/if}}
      - ': > /tmp/image.env'
{{#if HAS_BACKEND}}
      - bash .autoinfra/base-images.sh {{BE_DOCKERFILE}}
      - docker build -t "$ECR_REPOSITORY_URL:$IMAGE_TAG" -f {{BE_DOCKERFILE}}{{BE_DOCKER_TARGET}} "$AUTOINFRA_BE_DIR"
      - docker push "$ECR_REPOSITORY_URL:$IMAGE_TAG"
      - echo "APP_IMAGE=$ECR_REPOSITORY_URL:$IMAGE_TAG" >> /tmp/image.env
{{/if}}
{{#if SSR_FRONTEND}}
      - echo "WEB_IMAGE=$ECR_REPOSITORY_URL:web-$IMAGE_TAG" >> /tmp/image.env
{{/if}}
      - aws s3 cp .autoinfra/docker-compose.yml "s3://$ARTIFACTS_BUCKET/deploy/docker-compose.yml"
      - aws s3 cp .autoinfra/Caddyfile "s3://$ARTIFACTS_BUCKET/deploy/Caddyfile"
      - aws s3 cp .autoinfra/deploy.sh "s3://$ARTIFACTS_BUCKET/deploy/deploy.sh"
{{#if DB_ON_INSTANCE}}
      - aws s3 cp .autoinfra/backup.sh "s3://$ARTIFACTS_BUCKET/deploy/backup.sh"
{{/if}}
      - aws s3 cp /tmp/image.env "s3://$ARTIFACTS_BUCKET/deploy/image.env"
{{INIT_SCRIPT_UPLOADS}}
{{SETUP_UPLOADS}}
      # Roll out on the instance; on failure this prints the app's own logs.
      - bash .autoinfra/rollout.sh
{{/if}}
{{#if F1}}
      - bash .autoinfra/package-lambda.sh
{{/if}}
{{#if STATIC_FRONTEND}}
      - bash .autoinfra/publish-frontend.sh
{{/if}}
      - aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
